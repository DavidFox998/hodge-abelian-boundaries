name: MANIFEST LOCKED
on: [push, pull_request]
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean 4.11.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.11.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
        continue-on-error: true
      - name: Verify oracle
        run: cd rh && python3 -m src.oracle verify --strict --gematria
